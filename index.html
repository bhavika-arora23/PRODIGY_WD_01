<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitness Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header id="navbar" class="navbar">
    <div class="logo">FitnessPro</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#gallery">Gallery</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="home" class="hero">
    <div class="hero-overlay">
      <div class="hero-content">
        <h1><span class="typed-text"></span><span class="cursor">|</span></h1>
        <p class="fade-in">Your transformation begins here.</p>
      </div>
    </div>
  </section>

  <section id="gallery" class="gallery-section">
    <h2>Fitness Gallery</h2>
    <div class="image-grid">
      <img src="images\img1.jpg" alt="img1" class="boom-img">
      <img src="images\img2.jpg" alt="img2" class="boom-img">
      <img src="images\img3.jpg" alt="img3" class="boom-img">
      <img src="images\img4.jpg" alt="img4" class="boom-img">
      <img src="images\img5.jpg" alt="img5" class="boom-img">
      <img src="images\img6.jpg" alt="img6" class="boom-img">
    </div>
  </section>

  <section id="contact" class="section">
    <h2>Join Us Now</h2>
    <p>Start your fitness journey today!</p>
    <button class="join-btn">Get Started</button>
  </section>
  

  <script src="script.js"></script>
</body>
</html>
